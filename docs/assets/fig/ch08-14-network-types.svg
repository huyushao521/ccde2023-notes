<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img" aria-labelledby="t14 d14">
<title id="t14">OSPF 网络类型选错的后果：广播网段里 Spoke 被选成 DR，分支间流量黑洞</title>
<desc id="d14">左侧是错误配置：Hub 与两台 Spoke 通过运营商的二层 E-LAN 接在同一广播网段，OSPF 默认按广播类型处理，于是 Spoke-A 被选成 DR。Spoke-B 要去 Spoke-C 时，把流量交给 DR（Spoke-A），而 Spoke-A 与 Spoke-C 之间没有直连链路，也不具备转发条件，流量在 Spoke-A 被丢弃。右侧是正确做法：把 Hub 的接口配成 point-to-multipoint，Spoke 侧配成 point-to-point 或 p2mp，取消 DR 选举，每条邻接独立成一条 Type 1 链路描述，Spoke-B 直接选经 Hub 的最短路径。底部对比广播、点对点、点对多点三种类型在 DR 选举、Type 2 生成、Hello 与 Dead 间隔上的差别。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
  .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
  .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
  .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
  .n{font:9.5px "Segoe UI",sans-serif;fill:#1a2233}
</style>

<rect x="0" y="0" width="960" height="420" fill="#fbfcfe"/>
<text class="h" x="24" y="30">网络类型是"OSPF 对这段链路的假设"，假设错了就会选出错误的 DR</text>
<text class="s" x="24" y="48">运营商 E-LAN、GRE 隧道、帧中继 —— 它们看起来像以太网，但拓扑并不是共享介质</text>

<rect x="24" y="64" width="446" height="212" rx="5" fill="#fdf7f7" stroke="#e3b7b7"/>
<text class="lb" x="40" y="82" fill="#a32020">默认 broadcast：Spoke-A 成了 DR</text>
<ellipse cx="247" cy="186" rx="180" ry="46" fill="#fff" stroke="#e3b7b7" stroke-dasharray="5 3"/>
<text class="b" x="247" y="240" text-anchor="middle">运营商 E-LAN：同一广播网段</text>
<rect x="211" y="150" width="72" height="32" rx="4" fill="#eaf1ff" stroke="#2f6fed"/>
<text class="n" x="247" y="171" text-anchor="middle">Hub</text>
<rect x="56" y="104" width="86" height="32" rx="4" fill="#fdf7f7" stroke="#a32020" stroke-width="2"/>
<text class="n" x="99" y="125" text-anchor="middle">Spoke-A</text>
<text class="r" x="99" y="94" text-anchor="middle">★ DR</text>
<rect x="56" y="196" width="86" height="32" rx="4" fill="#fff" stroke="#c3d4f5"/>
<text class="n" x="99" y="217" text-anchor="middle">Spoke-B</text>
<rect x="352" y="196" width="86" height="32" rx="4" fill="#fff" stroke="#c3d4f5"/>
<text class="n" x="395" y="217" text-anchor="middle">Spoke-C</text>
<line x1="142" y1="120" x2="211" y2="160" stroke="#8494a8" stroke-width="1.4"/>
<line x1="142" y1="212" x2="211" y2="176" stroke="#8494a8" stroke-width="1.4"/>
<line x1="283" y1="176" x2="352" y2="212" stroke="#8494a8" stroke-width="1.4"/>
<path d="M142 200 L142 144" fill="none" stroke="#a32020" stroke-width="1.8" stroke-dasharray="5 3"/>
<text class="r" x="150" y="176">Spoke-B → DR(A) → 无路可走</text>
<text class="r" x="40" y="262">Spoke-B 认为"经 DR 可达 Spoke-C"，实际 Spoke-A 上根本没有这条路径</text>

<rect x="490" y="64" width="446" height="212" rx="5" fill="#f4f9f7" stroke="#a8d8ce"/>
<text class="lb" x="506" y="82" fill="#0f7f73">改 p2mp + p2p：取消 DR，逐条成链</text>
<rect x="676" y="150" width="72" height="32" rx="4" fill="#eaf1ff" stroke="#0f7f73"/>
<text class="n" x="712" y="171" text-anchor="middle">Hub</text>
<text class="b" x="712" y="196" text-anchor="middle">ip ospf network point-to-multipoint</text>
<rect x="522" y="104" width="86" height="32" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="n" x="565" y="125" text-anchor="middle">Spoke-A</text>
<rect x="522" y="196" width="86" height="32" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="n" x="565" y="217" text-anchor="middle">Spoke-B</text>
<rect x="818" y="196" width="86" height="32" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="n" x="861" y="217" text-anchor="middle">Spoke-C</text>
<line x1="608" y1="120" x2="676" y2="158" stroke="#0f7f73" stroke-width="1.8"/>
<line x1="608" y1="212" x2="676" y2="176" stroke="#0f7f73" stroke-width="1.8"/>
<line x1="748" y1="172" x2="818" y2="208" stroke="#0f7f73" stroke-width="1.8"/>
<text class="c" x="506" y="246">每条邻接独立成 Type 1 链路，Spoke-B 的最短路径 = 经 Hub，无 DR 中转</text>
<text class="c" x="506" y="264">无 Type 2 LSA，拓扑描述更忠实于实际转发路径</text>

<rect x="24" y="288" width="912" height="86" rx="5" fill="#eef3fd" stroke="#c3d4f5"/>
<text class="lb" x="40" y="306">三种网络类型速查</text>
<text class="b" x="40" y="324">broadcast　：选 DR/BDR、生成 Type 2、Hello 10s / Dead 40s　→ 真共享介质（交换机端口）</text>
<text class="b" x="40" y="342">point-to-point：不选 DR、无 Type 2、Hello 10s / Dead 40s　→ 串行链路、点到点以太网、/31 互联</text>
<text class="b" x="40" y="360">point-to-multipoint：不选 DR、无 Type 2、Hello 30s / Dead 120s、按 /32 主机路由描述　→ Hub-Spoke 的 WAN</text>

<rect x="24" y="382" width="912" height="32" rx="5" fill="#fdf9f3" stroke="#e6cfa8"/>
<text class="b" x="40" y="403" fill="#b45309">核对方法：show ip ospf interface 里看 Type 与实际介质是否一致；两侧不一致的邻居会卡在 EXSTART 或根本建不起来。</text>
</svg>
