<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="100%" role="img" aria-labelledby="t28 d28">
<title id="t28">出向与入向流量的控制手段与有效性差异</title>
<desc id="d28">拓扑是企业 AS 65000 有两条出口分别接 ISP1 与 ISP2。出向流量由企业自己选择出口，用 Local Preference 或 Weight 就能决定，配置在本机、立即生效、风险可控。入向流量由对端 AS 决定入口，企业只能用四种手段影响：最有效的是不向某条链路通告该前缀，其次是 AS_PATH 前置让某条路径看起来更长，再次是 community 让 ISP 按约定降低优先级，最弱的 MED 只能影响相邻一层 AS。底部给出判据：MED 只在"同一个邻居 AS 的两条链路"之间有意义，跨 AS 就失效；入向优化必须与 ISP 协同，单侧配置只是自我安慰。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
  .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
  .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
  .m{font:9.5px "Microsooft YaHei",sans-serif;fill:#b45309}
  .n{font:9.5px "Segoe UI",sans-serif;fill:#1a2233}
</style>

<rect x="0" y="0" width="960" height="424" fill="#fbfcfe"/>
<text class="h" x="24" y="30">出向是自己的事，入向是别人的事</text>
<text class="s" x="24" y="48">这句废话决定了 90% 的 BGP 策略设计错误 —— 用出向的手段去解决入向的问题</text>

<rect x="24" y="66" width="452" height="196" rx="6" fill="#eef3fd" stroke="#2f6fed"/>
<text class="lb" x="40" y="84">AS 65000</text>
<rect x="60" y="120" width="96" height="36" rx="4" fill="#fff" stroke="#2f6fed" stroke-width="2"/>
<text class="n" x="108" y="143" text-anchor="middle">BR1</text>
<rect x="60" y="184" width="96" height="36" rx="4" fill="#fff" stroke="#2f6fed"/>
<text class="n" x="108" y="207" text-anchor="middle">BR2</text>
<rect x="268" y="120" width="110" height="36" rx="4" fill="#f3f0fb" stroke="#b9a9e6"/>
<text class="n" x="323" y="143" text-anchor="middle">ISP1 · AS 65100</text>
<rect x="268" y="184" width="110" height="36" rx="4" fill="#f3f0fb" stroke="#b9a9e6"/>
<text class="n" x="323" y="207" text-anchor="middle">ISP2 · AS 65200</text>
<line x1="156" y1="138" x2="268" y2="138" stroke="#2f6fed" stroke-width="2.2"/>
<line x1="156" y1="202" x2="268" y2="202" stroke="#2f6fed" stroke-width="2.2"/>
<text class="c" x="168" y="130">出向 →</text>
<text class="r" x="168" y="222">← 入向</text>
<text class="b" x="40" y="250">出向：本机 LP / Weight 就够，改完立刻生效</text>

<rect x="492" y="66" width="444" height="196" rx="6" fill="#fdf7f7" stroke="#e3b7b7"/>
<text class="lb" x="508" y="84" fill="#a32020">入向：只能"建议"，不能"命令"</text>
<text class="b" x="508" y="104">① 不通告（最硬）：该前缀只从一个出口通告</text>
<text class="c" x="524" y="122">效果确定，但彻底放弃备份 —— 只适合"这条线路只做备份"</text>
<text class="b" x="508" y="146">② AS_PATH 前置：让某条路径看起来更长</text>
<text class="c" x="524" y="164">跨多层 AS 仍有效，是实战中最常用的入向手段</text>
<text class="b" x="508" y="188">③ community：让 ISP 按约定降优先级 / 不对外通告</text>
<text class="m" x="524" y="206">必须与 ISP 有书面约定，否则对方直接忽略</text>
<text class="b" x="508" y="230">④ MED（最弱）：只影响相邻一层 AS 的两条链路</text>
<text class="r" x="524" y="248">跨 AS 失效；对方策略更优时直接无视</text>

<rect x="24" y="278" width="452" height="84" rx="5" fill="#f4f9f7" stroke="#a8d8ce"/>
<text class="lb" x="40" y="296" fill="#0f7f73">出向验收</text>
<text class="b" x="40" y="314">show ip bgp &lt;前缀&gt;：确认 best 的下一跳是自己的期望出口</text>
<text class="b" x="40" y="332">show ip cef：确认 FIB 真的指向该出口（属性对了不代表走对了）</text>
<text class="b" x="40" y="350">traceroute 从内网发起：看到第一跳是对应 BR</text>

<rect x="492" y="278" width="444" height="84" rx="5" fill="#fdf9f3" stroke="#e6cfa8"/>
<text class="lb" x="508" y="296" fill="#b45309">入向验收</text>
<text class="b" x="508" y="314">必须从外部看：looking glass、第三方探针、或 ISP 侧 traceroute</text>
<text class="b" x="508" y="332">看"回到你这个前缀"的 AS_PATH 长度与入口链路</text>
<text class="b" x="508" y="350">内部 show 命令永远无法验证入向 —— 这是最常见的验收缺席</text>

<rect x="24" y="374" width="912" height="40" rx="5" fill="#eef3fd" stroke="#c3d4f5"/>
<text class="lb" x="40" y="391">双向设计的正确姿势</text>
<text class="b" x="40" y="408">先设计出向（自己做主），再用 AS_PATH 前置或 community 与 ISP 协同设计入向；MED 只在"同一 ISP 的两条链路"场景使用。</text>

<rect x="24" y="0" width="0" height="0" fill="none"/>
</svg>
