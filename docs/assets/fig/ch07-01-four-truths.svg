<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" role="img" aria-labelledby="t1 d1">
  <title id="t1">二层设计的四条反直觉认知：证据与判断标准</title>
  <desc id="d1">四张卡片：二层没有目的地概念只能查表或泛洪且帧无 TTL；STP 只是补救手段，判断标准是还有没有阻塞端口；二层故障几乎都静默，验收标准必须是故障场景下行为符合预期；冗余不等于可靠，除非两条路径的失效域独立。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
    .n{font:9px "Segoe UI",sans-serif;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="960" height="430" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">四条反直觉认知：每一条都对应一个能在设计评审上被问倒的问题</text>
  <text class="s" x="24" y="48">本章所有技术（STP/VLAN/Trunk/聚合/mLAG/FHRP）都是在给这四条"擦屁股"</text>

  <!-- 卡 1 -->
  <rect x="24" y="66" width="448" height="168" rx="6" fill="#fff" stroke="#2f6fed"/>
  <text class="lb" x="40" y="88">① 二层没有"目的地"这个概念</text>
  <rect x="40" y="98" width="416" height="52" rx="4" fill="#f4f7fd" stroke="#d7e0ef"/>
  <text class="n" x="52" y="116">① 已知单播：查 MAC 表 → 出接口（查不到就泛洪）</text>
  <text class="n" x="52" y="134">② 未知单播 / 广播 / 组播：泛洪到同 VLAN 所有端口</text>
  <text class="b" x="40" y="168">泛洪是原生行为，不是异常；以太网帧<b>没有 TTL</b>（IP 有 255 跳上限）</text>
  <text class="r" x="40" y="186">→ 环路不会"自己停下"，只会越积越多，直到链路与 CPU 全瘫</text>
  <text class="c" x="40" y="208">设计含义：STP 的全部工作是人为砍掉一部分链路，用带宽与时间换无环</text>
  <text class="c" x="40" y="224">这是本章所有设计逻辑的起点</text>

  <!-- 卡 2 -->
  <rect x="488" y="66" width="448" height="168" rx="6" fill="#fff" stroke="#2f6fed"/>
  <text class="lb" x="504" y="88">② STP 配得再好也只是"补救"</text>
  <rect x="504" y="98" width="416" height="76" rx="4" fill="#f4f7fd" stroke="#d7e0ef"/>
  <text class="b" x="516" y="114">第一代 802.1D：唯一防环机制，收敛 30–50 秒</text>
  <text class="b" x="516" y="130">第二代 RSTP / MST：收敛 1–3 秒，但仍必须阻塞端口</text>
  <text class="b" x="516" y="146">第三代 聚合 + 无环 U 型：无阻塞端口，STP 只做兜底</text>
  <text class="b" x="516" y="162">第四代 mLAG / VSS / vPC / EVPN-MH：STP 完全不参与</text>
  <text class="r" x="504" y="196">判断标准：还有端口处在 BLK / ALTN 状态被浪费</text>
  <text class="r" x="504" y="212">→ 说明你的设计还停在第三代以前</text>
  <text class="c" x="504" y="228">每引入一项二层技术，先问它消灭了哪个阻塞端口或收敛依赖</text>

  <!-- 卡 3 -->
  <rect x="24" y="246" width="448" height="164" rx="6" fill="#fff" stroke="#b45309"/>
  <text class="lb" x="40" y="268" fill="#b45309">③ 二层故障几乎都是"静默"的</text>
  <rect x="40" y="278" width="416" height="18" rx="3" fill="#fdf6ec"/>
  <text class="b" x="52" y="291">现象　│ 用户描述　│ 真实原因</text>
  <text class="b" x="52" y="311">变慢　│"网有点卡"│ 流量绕行了一条几乎没带宽的路径</text>
  <text class="b" x="52" y="327">部分不通│"这层楼有的电脑上不了网"│ ARP / MAC 表被污染</text>
  <text class="b" x="52" y="343">时通时不通│"刷新几次就好"│ 环路导致 MAC 表翻转</text>
  <text class="b" x="52" y="359">大面积断│"整栋楼上不了网"│ 广播风暴 / 脑裂</text>
  <text class="c" x="40" y="382">验收标准不能是"能通"，必须是"故障场景下行为符合预期"</text>
  <text class="c" x="40" y="398">→ 这一条直接决定了本章为什么反复强调"演练 + 时间预算"</text>

  <!-- 卡 4 -->
  <rect x="488" y="246" width="448" height="164" rx="6" fill="#fff" stroke="#a32020"/>
  <text class="lb" x="504" y="268" fill="#a32020">④ 冗余 ≠ 可靠，除非失效域独立</text>
  <rect x="504" y="278" width="416" height="70" rx="4" fill="#fdf3f3" stroke="#f0d5d5"/>
  <text class="b" x="516" y="294">看起来是冗余　　　　　　实际上仍是单点</text>
  <text class="b" x="516" y="310">两根光纤走同一桥架　　　　一处施工</text>
  <text class="b" x="516" y="326">两条链路上联同一台交换机　　那台交换机</text>
  <text class="b" x="516" y="342">双上行到同一机柜的两台设备　机柜（断电/水/火）</text>
  <text class="m" x="504" y="368">本章两个真实事故：案例二（peer-link 与 keepalive 同管道 → 脑裂两小时）</text>
  <text class="m" x="504" y="384">案例五（两台 DSW 同机柜同市电 → 断电时两条路径一起没）</text>
  <text class="r" x="504" y="404">评审必问：这两条路径的失效域是独立的吗？答不上就别写"高可用"</text>
</svg>
