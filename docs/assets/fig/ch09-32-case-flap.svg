<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" role="img" aria-labelledby="t932 d932">
<title id="t932">案例三：双归属站点加后门链路，Domain ID 不一致导致 BGP 与 OSPF 互搏</title>
<desc id="d932">图上还原案例三。工厂通过两个 PE 双归属接入 MPLS，同时有一条微波链路直连总部作为后门，设计意图是 MPLS 为主、微波为备。实际运行中业务时通时断，traceroute 显示路径在两个出口之间来回变，部分会话 TTL 耗尽。排查发现两端 PE 的 OSPF Domain ID 不一致，一侧是默认 0.0.0.1，另一侧被手工改过。因为不一致，PE 把对方经 MP-BGP 传来的 Type 3 LSA 当成来自另一个 OSPF 域的路由，重新生成 LSA 并再次重分发回 BGP，形成 BGP 到 OSPF 再到 BGP 的回流，DN 位防环机制失效。微波链路 OSPF cost 低，于是永远是 intra-area 优选，而 MPLS 侧又不断覆盖回来，两端互搏。右侧是修复三件套：两端 Domain ID 统一为 0.0.0.1；用 sham-link（10.255.0.1 到 10.255.0.2，cost 10）把 MPLS 伪装成 intra-area；备份链路显式抬高 cost 到 65535 并用 BFD 快速探测。底部给出教训：有后门链路就必须处理协议优先级问题，后门不只是备用，它会主动抢流量。</desc>
