<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="100%" role="img" aria-labelledby="t14 d14">
  <title id="t14">端到端 VLAN 与本地 VLAN：同一个二层域，两种命运</title>
  <desc id="d14">左侧端到端 VLAN，同一个 VLAN 10 通过 trunk 跨越三台接入交换机与两台核心，二层域覆盖全部设备，任一处环路或 TC 都会波及全园区，网关只能放在核心。右侧本地 VLAN，每台接入交换机使用自己的 VLAN 与子网，核心承担三层网关，二层域缩到一台接入加一条上行，故障影响面被限制在单台接入。底部对比两者在故障影响面、收敛依赖、网关位置、VLAN 数量与适用场景上的差异，并指出本地 VLAN 的代价是地址规划与漫游体验。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
    .n{font:9.5px "Segoe UI",sans-serif;fill:#1a2233}
    .th{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  </style>

  <rect x="0" y="0" width="960" height="448" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">同一个"VLAN 10"，端到端与本地是两种完全不同的风险模型</text>
  <text class="s" x="24" y="48">判断依据只有一句：这个 VLAN 跨了几台交换机，它的故障影响面就是几台</text>

  <!-- 左：端到端 -->
  <rect x="24" y="66" width="448" height="212" rx="6" fill="#fdf7f7" stroke="#e3b7b7"/>
  <text class="lb" x="38" y="88" fill="#a32020">① 端到端 VLAN（大二层）</text>
  <text class="b" x="38" y="106">VLAN 10 跨越全部 5 台设备，二层域 = 整个园区</text>

  <rect x="120" y="120" width="86" height="32" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="163" y="141" text-anchor="middle">DSW1</text>
  <rect x="290" y="120" width="86" height="32" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="333" y="141" text-anchor="middle">DSW2</text>
  <line x1="206" y1="136" x2="290" y2="136" stroke="#2f6fed" stroke-width="1.4"/>
  <rect x="80" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="120" y="216" text-anchor="middle">ASW1</text>
  <rect x="196" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="236" y="216" text-anchor="middle">ASW2</text>
  <rect x="312" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="352" y="216" text-anchor="middle">ASW3</text>
  <line x1="150" y1="152" x2="120" y2="196" stroke="#2f6fed" stroke-width="1.4"/>
  <line x1="250" y1="152" x2="236" y2="196" stroke="#2f6fed" stroke-width="1.4"/>
  <line x1="343" y1="152" x2="352" y2="196" stroke="#2f6fed" stroke-width="1.4"/>
  <line x1="160" y1="211" x2="196" y2="211" stroke="#a32020" stroke-width="2"/>
  <line x1="276" y1="211" x2="312" y2="211" stroke="#a32020" stroke-width="2"/>
  <text class="r" x="170" y="188">trunk 互联（二层延伸）</text>
  <text class="r" x="38" y="252">任一处环路 / TC → 五台设备一起受牵连</text>
  <text class="b" x="38" y="270">网关只能在核心，A/B 两侧都得靠 STP 选路</text>

  <!-- 右：本地 VLAN -->
  <rect x="488" y="66" width="448" height="212" rx="6" fill="#f4f9f7" stroke="#a8d8ce"/>
  <text class="lb" x="502" y="88" fill="#0f7f73">② 本地 VLAN（三层到接入）</text>
  <text class="b" x="502" y="106">每台接入用自己的 VLAN/子网，二层域 = 1 台接入 + 1 条上行</text>

  <rect x="584" y="120" width="86" height="32" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="627" y="141" text-anchor="middle">DSW1</text>
  <rect x="754" y="120" width="86" height="32" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="797" y="141" text-anchor="middle">DSW2</text>
  <line x1="670" y1="136" x2="754" y2="136" stroke="#8494a8" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text class="m" x="712" y="130" text-anchor="middle">三层互联</text>
  <rect x="544" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="584" y="216" text-anchor="middle">ASW1</text>
  <rect x="660" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="700" y="216" text-anchor="middle">ASW2</text>
  <rect x="776" y="196" width="80" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="816" y="216" text-anchor="middle">ASW3</text>
  <line x1="614" y1="152" x2="584" y2="196" stroke="#0f7f73" stroke-width="1.8"/>
  <line x1="714" y1="152" x2="700" y2="196" stroke="#0f7f73" stroke-width="1.8"/>
  <line x1="807" y1="152" x2="816" y2="196" stroke="#0f7f73" stroke-width="1.8"/>
  <text class="c" x="502" y="252">ASW1 的环路只影响 ASW1 下挂的用户</text>
  <text class="c" x="502" y="270">网关就在核心；STP 只剩"上行双归要不要通"一个问题</text>

  <!-- 对比表 -->
  <rect x="24" y="292" width="912" height="22" fill="#eef3fb" stroke="#d7e0ef"/>
  <text class="th" x="34" y="307">维度</text><text class="th" x="230" y="307">端到端 VLAN</text>
  <text class="th" x="560" y="307">本地 VLAN</text><text class="th" x="820" y="307">要点</text>

  <rect x="24" y="314" width="912" height="24" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="34" y="330">故障影响面</text><text class="b" x="230" y="330">整个园区（全部交换机）</text>
  <text class="b" x="560" y="330">单台接入及其下挂用户</text><text class="r" x="820" y="330">差一个数量级</text>

  <rect x="24" y="338" width="912" height="24" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="34" y="354">收敛依赖</text><text class="b" x="230" y="354">STP + FHRP 都必须正确</text>
  <text class="c" x="560" y="354">只看上行链路与路由</text><text class="c" x="820" y="354">本地 VLAN 更可控</text>

  <rect x="24" y="362" width="912" height="24" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="34" y="378">网关位置</text><text class="b" x="230" y="378">只能在核心（HSRP/VRRP）</text>
  <text class="b" x="560" y="378">核心做三层网关，天然就近</text><text class="c" x="820" y="378">本地更简单</text>

  <rect x="24" y="386" width="912" height="24" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="34" y="402">代价</text><text class="b" x="230" y="402">VLAN/子网数少，地址易规划</text>
  <text class="m" x="560" y="402">VLAN/子网数多，跨层漫游要重编址</text><text class="m" x="820" y="402">本地 VLAN 的账单</text>

  <rect x="24" y="416" width="912" height="26" rx="4" fill="#f4f9f7" stroke="#0f7f73"/>
  <text class="c" x="36" y="434">结论：新园区优先本地 VLAN；只有当业务<b>强依赖跨接入的二层相邻</b>（老系统广播发现、硬件集群心跳）时才让 VLAN 跨交换机，并且只跨最小集合。</text>
</svg>
