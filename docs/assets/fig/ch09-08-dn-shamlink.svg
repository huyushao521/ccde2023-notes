<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" role="img" aria-labelledby="t98 d98">
<title id="t98">OSPF 作为 PE-CE 时的 DN 位、Domain ID 与 Sham Link 三个机制</title>
<desc id="d98">上方是 DN 位的三步工作机制：PE 把 BGP 学到的 VPN 路由重分发进 OSPF 时在 LSA 的 Options 字段置 DN 位；另一个 PE 从 VRF 接口收到带 DN 位的 LSA 时拒绝装库也不再重分发回 BGP；结果是路由不会在 BGP 到 OSPF 到 BGP 之间来回震荡。中间是故障机理：同一 OSPF 域的两个站点之间既有 MPLS 链路又有后门链路，如果两端 PE 的 Domain ID 不一致，PE 会把对方发来的 Type 3 LSA 当成不同域的路由重新生成，DN 位失效，形成路由翻转与 TTL 逐渐耗尽的环路。下方是 Sham Link 的拓扑与效果：默认 MPLS 学到的路由是 Inter-Area 或 External，而后门链路是 Intra-Area，OSPF 优先级 Intra 高于 Inter 高于 External，所以 10M 微波链路永远赢过 1G 光纤；Sham Link 在两端 PE 之间建一条 Intra-Area 逻辑链路，把 MPLS 路径伪装成区域内部链路，优先级反转。三条前置条件缺一不可：两端 /32 通过 MP-BGP 互可达、同一 OSPF area、Domain ID 一致。</desc>
