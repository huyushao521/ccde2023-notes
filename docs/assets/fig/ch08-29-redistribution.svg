<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="100%" role="img" aria-labelledby="t29 d29">
<title id="t29">单点与双点双向重分发的回馈环路，以及 tag 加过滤的解法</title>
<desc id="d29">上部是单点重分发：一台边界路由器两侧分别运行 OSPF 与 EIGRP，OSPF 的明细被重分发进 EIGRP，EIGRP 又把同一条路由重分发回 OSPF，形成回馈，结果是同一个前缀在两个协议里不断互相学习，度量被反复改写。下部是双点双向：两台边界路由器同时做双向重分发，回馈路径多出两条，还会出现次优路径：流量从 R1 进入却在 R2 处被送回。右侧给出三件套解法：用 route-map 给重分发进去的路由打上 tag，反向重分发时拒绝带该 tag 的路由；用前缀过滤明确只放行需要的网段；必要时调整管理距离，让首选协议的路由优先，避免次优回程。底部结论是重分发必须"有方向、有标签、有白名单"，三条缺一条就会在某个时刻形成环路。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
  .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
  .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
  .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
  .n{font:9.5px "Segoe UI",sans-serif;fill:#1a2233}
</style>

<rect x="0" y="0" width="960" height="424" fill="#fbfcfe"/>
<text class="h" x="24" y="30">重分发不是"翻译"，是"互相抄写"——抄回来就成了环</text>
<text class="s" x="24" y="48">每一条 redistribute 都要能回答：什么进来、带什么标签、从哪出去、怎么拒绝回来</text>

<rect x="24" y="64" width="440" height="130" rx="5" fill="#fdf7f7" stroke="#e3b7b7"/>
<text class="lb" x="40" y="82" fill="#a32020">单点双向：一个口子，两条回馈</text>
<rect x="60" y="104" width="90" height="34" rx="4" fill="#fff" stroke="#2f6fed"/>
<text class="n" x="105" y="127" text-anchor="middle">OSPF 域</text>
<rect x="200" y="104" width="90" height="34" rx="4" fill="#fdf7f7" stroke="#a32020" stroke-width="2"/>
<text class="n" x="245" y="127" text-anchor="middle">ASBR</text>
<rect x="340" y="104" width="90" height="34" rx="4" fill="#fff" stroke="#0f7f73"/>
<text class="n" x="385" y="127" text-anchor="middle">EIGRP 域</text>
<line x1="150" y1="121" x2="200" y2="121" stroke="#8494a8" stroke-width="1.6"/>
<line x1="290" y1="121" x2="340" y2="121" stroke="#8494a8" stroke-width="1.6"/>
<path d="M245 104 L245 90" stroke="#a32020" stroke-width="1.4"/>
<text class="b" x="40" y="162">10.1.0.0/24 进 EIGRP → 又被 EIGRP 重分发回 OSPF</text>
<text class="r" x="40" y="180">度量被反复改写，next-hop 语义丢失，路径逐渐失真</text>

<rect x="488" y="64" width="448" height="130" rx="5" fill="#fdf7f7" stroke="#e3b7b7"/>
<text class="lb" x="504" y="82" fill="#a32020">双点双向：多出两条回馈 + 次优回程</text>
<rect x="520" y="96" width="80" height="28" rx="4" fill="#fff" stroke="#2f6fed"/>
<text class="n" x="560" y="115" text-anchor="middle">OSPF</text>
<rect x="640" y="96" width="70" height="28" rx="4" fill="#fdf7f7" stroke="#a32020" stroke-width="2"/>
<text class="n" x="675" y="115" text-anchor="middle">R1</text>
<rect x="640" y="146" width="70" height="28" rx="4" fill="#fdf7f7" stroke="#a32020" stroke-width="2"/>
<text class="n" x="675" y="165" text-anchor="middle">R2</text>
<rect x="800" y="118" width="80" height="28" rx="4" fill="#fff" stroke="#0f7f73"/>
<text class="n" x="840" y="137" text-anchor="middle">EIGRP</text>
<line x1="600" y1="110" x2="640" y2="110" stroke="#8494a8" stroke-width="1.4"/>
<line x1="600" y1="132" x2="640" y2="160" stroke="#8494a8" stroke-width="1.4"/>
<line x1="710" y1="110" x2="800" y2="126" stroke="#8494a8" stroke-width="1.4"/>
<line x1="710" y1="160" x2="800" y2="140" stroke="#8494a8" stroke-width="1.4"/>
<path d="M675 124 L675 146" stroke="#a32020" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="r" x="504" y="188">流量从 R1 进，回程却从 R2 出 → 防火墙非对称丢包</text>

<rect x="24" y="208" width="912" height="120" rx="5" fill="#f4f9f7" stroke="#a8d8ce"/>
<text class="lb" x="40" y="226" fill="#0f7f73">三件套：方向、标签、白名单</text>
<rect x="40" y="236" width="284" height="82" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="k" x="54" y="254">① tag（最有效的防回馈）</text>
<text class="b" x="54" y="272">OSPF→EIGRP 时 set tag 100</text>
<text class="b" x="54" y="290">EIGRP→OSPF 时 deny tag 100</text>
<text class="b" x="54" y="308">反向同理，各用一个 tag</text>
<rect x="338" y="236" width="284" height="82" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="k" x="352" y="254">② 前缀白名单</text>
<text class="b" x="352" y="272">route-map 里只 permit 该放的网段</text>
<text class="b" x="352" y="290">默认 deny：没写的一条都进不来</text>
<text class="b" x="352" y="308">比"写 deny"安全得多</text>
<rect x="636" y="236" width="284" height="82" rx="4" fill="#fff" stroke="#a8d8ce"/>
<text class="k" x="650" y="254">③ 管理距离（治次优）</text>
<text class="b" x="650" y="272">外部 EIGRP 170 / OSPF 110</text>
<text class="b" x="650" y="290">同一前缀两协议都有时，AD 决定谁进表</text>
<text class="b" x="650" y="308">改 AD 要写清"为什么"，否则下一个工程师会改回来</text>

<rect x="24" y="342" width="912" height="72" rx="5" fill="#eef3fd" stroke="#c3d4f5"/>
<text class="lb" x="40" y="360">上线前的四个问题（答不全就别配重分发）</text>
<text class="b" x="40" y="378">① 哪些前缀需要跨协议？列出清单，而不是"全部"　　② 每个方向用什么 tag？　　③ 反向如何拒绝？</text>
<text class="b" x="40" y="396">④ 出现次优回程时，靠 AD 还是靠前缀过滤修正？</text>
<text class="c" x="40" y="412">更好的方案：能用 BGP 统一核心就不要叠协议转换 —— 重分发的复杂度几乎永远超过它解决的问题</text>

<rect x="0" y="0" width="0" height="0" fill="none"/>
</svg>
