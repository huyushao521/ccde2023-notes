<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="100%" role="img" aria-labelledby="t13 d13">
  <title id="t13">生产环境 STP 基线配置与 MST 的三个致命细节</title>
  <desc id="d13">左侧三块配置：全局启用 Rapid PVST+ 或 MST 并设定优先级步长；分布层设置主备根桥；接入层启用 PortFast、BPDU 防护、根保护与环路保护。右侧列出 MST 的三个致命细节：region 名称与 revision 全网必须完全一致，否则同一区域被拆成两个；VLAN 到实例的映射必须逐跳一致，否则同一 VLAN 在不同设备属于不同实例；实例 0 默认承载所有未映射 VLAN，不要往里塞业务以免一个实例故障牵动全部。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
    .mono{font:9px "Consolas",monospace;fill:#1a2233}
    .cmt{font:9px "Consolas",monospace;fill:#7c8b9f}
  </style>

  <rect x="0" y="0" width="960" height="412" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">STP 基线：三块配置 + 三个致命细节，缺一项就是"配了但不生效"</text>
  <text class="s" x="24" y="48">基线的作用不是"让 STP 能跑"，而是"让 STP 只在你预期的端口上生效"</text>

  <!-- 全局 -->
  <text class="lb" x="24" y="76">① 全局：选版本与优先级基数</text>
  <rect x="24" y="84" width="440" height="72" rx="4" fill="#0f172a"/>
  <text class="mono" x="36" y="104" fill="#cfe0ff">spanning-tree mode rapid-pvst</text>
  <text class="mono" x="36" y="122" fill="#cfe0ff">spanning-tree extend system-id</text>
  <text class="mono" x="36" y="140" fill="#8fa3c8">! 优先级只允许 0/4096/8192…61440 步长 4096</text>

  <!-- 分布层 -->
  <text class="lb" x="24" y="180">② 分布层：主备根桥成对配置</text>
  <rect x="24" y="188" width="440" height="90" rx="4" fill="#0f172a"/>
  <text class="mono" x="36" y="208" fill="#cfe0ff">spanning-tree vlan 10-99 root primary</text>
  <text class="mono" x="36" y="226" fill="#cfe0ff">spanning-tree vlan 100-199 root secondary</text>
  <text class="mono" x="36" y="244" fill="#8fa3c8">! 同一对设备上，两组 VLAN 互为备份</text>
  <text class="mono" x="36" y="262" fill="#8fa3c8">! 使根桥与 HSRP Active 落在同一台</text>

  <!-- 接入层 -->
  <text class="lb" x="24" y="302">③ 接入层：接入口一律视为边缘</text>
  <rect x="24" y="310" width="440" height="90" rx="4" fill="#0f172a"/>
  <text class="mono" x="36" y="330" fill="#cfe0ff">interface range Gi1/0/1-24</text>
  <text class="mono" x="36" y="348" fill="#cfe0ff"> spanning-tree portfast</text>
  <text class="mono" x="36" y="366" fill="#cfe0ff"> spanning-tree bpduguard enable</text>
  <text class="mono" x="36" y="384" fill="#cfe0ff"> spanning-tree guard root</text>

  <!-- MST 三细节 -->
  <text class="lb" x="488" y="76">MST 的三个致命细节（少一个就不是同一个 region）</text>

  <rect x="488" y="84" width="448" height="86" rx="5" fill="#fdf7f7" stroke="#e3b7b7"/>
  <text class="r" x="500" y="104">① region 名称与 revision 必须全网逐字一致</text>
  <rect x="500" y="112" width="424" height="46" rx="3" fill="#0f172a"/>
  <text class="mono" x="510" y="130" fill="#cfe0ff">spanning-tree mst configuration</text>
  <text class="mono" x="510" y="148" fill="#cfe0ff"> name CAMPUS-A   revision 1</text>
  <text class="b" x="500" y="182">差一个字符 → 两台设备分属两个 region → 区域边界上出现意料外的阻塞</text>

  <rect x="488" y="182" width="448" height="86" rx="5" fill="#fdf7f7" stroke="#e3b7b7"/>
  <text class="r" x="500" y="202">② VLAN→实例 映射必须逐跳一致</text>
  <rect x="500" y="210" width="424" height="46" rx="3" fill="#0f172a"/>
  <text class="mono" x="510" y="228" fill="#cfe0ff"> instance 1 vlan 10-49</text>
  <text class="mono" x="510" y="246" fill="#cfe0ff"> instance 2 vlan 50-99</text>
  <text class="b" x="500" y="280">同一个 VLAN 在 A 机属实例 1、在 B 机属实例 2 → 阻塞端口位置完全不可预测</text>

  <rect x="488" y="280" width="448" height="86" rx="5" fill="#fdf6ec" stroke="#e5d08a"/>
  <text class="m" x="500" y="300">③ 实例 0 承载所有"未映射"的 VLAN</text>
  <text class="b" x="500" y="320">默认所有 VLAN 都在实例 0 → 实例 0 的一次拓扑变更会牵动全部业务</text>
  <text class="c" x="500" y="340">做法：先把业务 VLAN 全部显式映射到实例 1–n，让实例 0 保持"空"</text>
  <text class="b" x="500" y="360">验证：<tspan class="mono">show spanning-tree mst configuration digest</tspan></text>

  <rect x="488" y="376" width="448" height="24" rx="4" fill="#f4f9f7" stroke="#0f7f73"/>
  <text class="c" x="500" y="392">三台的 digest 必须相同 —— 这是验证 MST 一致性的唯一硬指标</text>
</svg>
