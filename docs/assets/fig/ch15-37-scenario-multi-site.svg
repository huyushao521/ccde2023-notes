<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" role="img" aria-labelledby="t1537 d1537">
<title id="t1537">四厂区合并情景：三层模型加路由接入与 VRF-Lite 的目标架构及四周滚动迁移</title>
<desc id="d1537">图上半是四厂区合并后的目标架构：集团核心运行 OSPF 区域零，向下连接四个厂区分布块，每个厂区各自一个 OSPF 区域；厂区内部分成 IT 块与 OT 块，IT 块采用路由接入、每配线间一个子网，OT 块采用堆叠集群并经工业防火墙单向访问 MES。图中标注两个隔离域为 IT 与 OT 两个 VRF，OT 侧没有默认路由、仅 MES 前缀可达。图下半是四周滚动迁移甘特：第一周建 OSPF 区域并把分布层接入核心、业务路径不变；第二周新建 OT VRF 与防火墙边界、OT 设备逐台迁移；第三周办公区按配线间切换为路由接入；第四周拆除旧 STP 域、清理 VLAN 并做拔电演练，四周合计单次停机不超过三十分钟。右下角给出"为什么不上 fabric"的三行判据：策略随人走不需要、大规模自动化不需要、代价是六到十二个月学习成本。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
