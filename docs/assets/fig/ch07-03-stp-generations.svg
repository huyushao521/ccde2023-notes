<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" role="img" aria-labelledby="t3 d3">
  <title id="t3">二层防环的四代演进：从"必阻塞"到"STP 不参与"</title>
  <desc id="d3">左侧四代对照：802.1D 收敛 30–50 秒；RSTP/MST 1–3 秒但仍阻塞端口；链路聚合加无环 U 型没有阻塞端口、STP 只做兜底；mLAG/vPC/EVPN-MH 让 STP 完全不参与、所有链路转发。右侧两个拓扑对比：三角形拓扑中一条上行被 ALTN 阻塞，2×10G 只能用 10G；mLAG 双活下两条上行全部转发，可用 20G。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .r{font:9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .m{font:9.5px "Microsoft YaHei",sans-serif;fill:#b45309}
    .n{font:9.5px "Segoe UI",sans-serif;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="960" height="430" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">四代演进：每一代的成就都是"少一个阻塞端口、少一次等计时器"</text>
  <text class="s" x="24" y="48">技术选型的判断依据不是"先不先进"，而是"它替掉了哪一段收敛依赖"</text>

  <!-- 四代 -->
  <rect x="24" y="72" width="56" height="72" rx="4" fill="#fdf3f3" stroke="#a32020"/>
  <text class="n" x="52" y="98" text-anchor="middle">第一代</text><text class="b" x="52" y="116" text-anchor="middle">802.1D</text>
  <rect x="88" y="72" width="352" height="72" rx="4" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="100" y="92">唯一防环机制，收敛 <tspan class="r">30–50 秒</tspan></text>
  <text class="b" x="100" y="112">等 Max Age 20s + Listening 15s + Learning 15s</text>
  <text class="b" x="100" y="130">设计含义：任何一次拓扑变化都是一次分钟级业务中断</text>

  <rect x="24" y="152" width="56" height="72" rx="4" fill="#fdf6ec" stroke="#b45309"/>
  <text class="n" x="52" y="178" text-anchor="middle">第二代</text><text class="b" x="52" y="196" text-anchor="middle">RSTP/MST</text>
  <rect x="88" y="152" width="352" height="72" rx="4" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="100" y="172">协商驱动，收敛 <tspan class="m">1–3 秒</tspan></text>
  <text class="b" x="100" y="192">Proposal/Agreement 逐跳推进，不再等计时器</text>
  <text class="b" x="100" y="210">设计含义：现代默认基线，但<b>仍然必须阻塞端口</b></text>

  <rect x="24" y="232" width="56" height="72" rx="4" fill="#eef7f4" stroke="#0f7f73"/>
  <text class="n" x="52" y="258" text-anchor="middle">第三代</text><text class="b" x="52" y="276" text-anchor="middle">聚合+U型</text>
  <rect x="88" y="232" width="352" height="72" rx="4" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="100" y="252">没有阻塞端口，STP 只做<tspan class="c">兜底保护</tspan></text>
  <text class="b" x="100" y="272">前提：VLAN 不跨交换机（本地 VLAN / 三层到接入）</text>
  <text class="b" x="100" y="290">设计含义：收敛不再依赖 STP，改由链路检测 + 路由决定</text>

  <rect x="24" y="312" width="56" height="72" rx="4" fill="#eaf1ff" stroke="#2f6fed"/>
  <text class="n" x="52" y="338" text-anchor="middle">第四代</text><text class="b" x="52" y="356" text-anchor="middle">mLAG</text>
  <rect x="88" y="312" width="352" height="72" rx="4" fill="#fff" stroke="#e0e7f1"/>
  <text class="k" x="100" y="332">STP <tspan class="c">完全不参与</tspan>，所有链路都转发</text>
  <text class="b" x="100" y="352">VSS / vPC / 标准 M-LAG / EVPN Multihoming</text>
  <text class="b" x="100" y="370">代价：引入脑裂与配置一致性风险（见 7-21 / 7-22）</text>

  <!-- 右上拓扑：三角形 -->
  <text class="lb" x="480" y="72">①–③ 代：三角形拓扑，一条上行被 ALTN 浪费</text>
  <rect x="480" y="80" width="456" height="150" rx="5" fill="#fff" stroke="#e0e7f1"/>
  <rect x="530" y="96" width="70" height="30" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="565" y="116" text-anchor="middle">DSW1</text>
  <rect x="816" y="96" width="70" height="30" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="851" y="116" text-anchor="middle">DSW2</text>
  <rect x="673" y="172" width="70" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="708" y="192" text-anchor="middle">ASW</text>
  <line x1="600" y1="111" x2="816" y2="111" stroke="#2f6fed" stroke-width="1.6"/>
  <line x1="565" y1="126" x2="690" y2="172" stroke="#2f6fed" stroke-width="1.6"/>
  <line x1="851" y1="126" x2="726" y2="172" stroke="#a32020" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="r" x="748" y="150">ALTN（阻塞）</text>
  <text class="c" x="490" y="216">2×10G 上行只能用 <tspan class="k">10G</tspan> —— 浪费 50%；任一处故障都要 STP 收敛</text>

  <!-- 右下拓扑：mLAG -->
  <text class="lb" x="480" y="258">④ 代：mLAG / vPC，两条上行都转发</text>
  <rect x="480" y="266" width="456" height="150" rx="5" fill="#fff" stroke="#e0e7f1"/>
  <rect x="530" y="282" width="70" height="30" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="565" y="302" text-anchor="middle">SW1</text>
  <rect x="816" y="282" width="70" height="30" rx="4" fill="#eaf1ff" stroke="#2f6fed"/><text class="n" x="851" y="302" text-anchor="middle">SW2</text>
  <line x1="600" y1="297" x2="816" y2="297" stroke="#8494a8" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text class="m" x="690" y="291">peer-link</text>
  <rect x="660" y="356" width="86" height="30" rx="4" fill="#fff" stroke="#2f6fed"/><text class="n" x="703" y="376" text-anchor="middle">ASW</text>
  <line x1="565" y1="312" x2="680" y2="356" stroke="#0f7f73" stroke-width="1.8"/>
  <line x1="851" y1="312" x2="726" y2="356" stroke="#0f7f73" stroke-width="1.8"/>
  <text class="c" x="560" y="344">转发</text><text class="c" x="790" y="344">转发</text>
  <text class="c" x="490" y="404">2×10G 全部可用 = <tspan class="k">20G</tspan>；STP 与 FHRP 都不参与决策</text>
</svg>
