<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="100%" role="img" aria-labelledby="t1511 d1511">
<title id="t1511">L2/L3 分界点的三个位置：分布层、接入层、核心层，以及各自带来的故障域大小</title>
<desc id="d1511">三个并列的小拓扑。左边的分界点在分布层，接入交换机是纯二层，VLAN 跨越所有接入交换机，STP 域覆盖整个区域，故障域最大；这是传统多层设计。中间的分界点在接入层，网关 SVI 落在每台接入交换机上，STP 与 FHRP 同时消失，故障域等于一台接入交换机，但子网数量上升。右边的分界点在核心层，接入与分布都是二层，VLAN 跨越多栋楼，STP 域直径可达 5 到 7 跳，是故障影响面最大的选择，只在极少数必须跨楼大二层时使用。底部给出三条判断依据：谁需要跨设备二层、谁承担网关、谁愿意接受多少子网与多少故障域。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  .b{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
  .k{font:600 9px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .r{font:9px "Microsoft YaHei",sans-serif;fill:#a32020}
  .c{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
  .m{font:9px "Microsoft YaHei",sans-serif;fill:#b45309}
  .t{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
</style>
<rect x="0" y="0" width="960" height="446" fill="#fbfcfe"/>

<text class="h" x="24" y="30">同一个园区，L2/L3 分界点放三个不同位置 = 三种完全不同的网络</text>
<text class="s" x="24" y="48">分界点决定：STP 域多大、网关在哪、故障域多大、子网用多少</text>

<!-- 位置一：分布层 -->
<rect x="24" y="62" width="290" height="252" rx="6" fill="#fff5f5" stroke="#f0c9c9"/>
<text class="lb" x="38" y="82" fill="#a32020">① 分界点在分布层（传统）</text>
<rect x="52" y="92" width="90" height="26" rx="3" fill="#fff" stroke="#d98c8c"/>
<text class="k" x="97" y="110" text-anchor="middle">L2 域</text>
<rect x="150" y="92" width="150" height="26" rx="3" fill="#fff" stroke="#8aa9e8"/>
<text class="b" x="225" y="110" text-anchor="middle">分布：SVI + HSRP</text>
<rect x="52" y="142" width="110" height="26" rx="3" fill="#fff" stroke="#e3c795"/>
<text class="b" x="107" y="160" text-anchor="middle">接入-1（L2）</text>
<rect x="172" y="142" width="110" height="26" rx="3" fill="#fff" stroke="#e3c795"/>
<text class="b" x="227" y="160" text-anchor="middle">接入-2（L2）</text>
<line x1="97" y1="118" x2="97" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="227" y1="118" x2="227" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="97" y1="168" x2="97" y2="186" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="227" y1="168" x2="227" y2="186" stroke="#7f8fb0" stroke-width="1.3"/>
<rect x="60" y="186" width="74" height="24" rx="3" fill="#fbfcfe" stroke="#d9c49b"/>
<text class="t" x="97" y="202" text-anchor="middle">VLAN 10</text>
<rect x="190" y="186" width="74" height="24" rx="3" fill="#fbfcfe" stroke="#d9c49b"/>
<text class="t" x="227" y="202" text-anchor="middle">VLAN 10</text>
<text class="r" x="38" y="236">VLAN 跨全部接入 → STP 域 = 全区</text>
<text class="r" x="38" y="252">网关集中，故障域最大</text>
<text class="b" x="38" y="268">子网省，终端零改造</text>
<text class="m" x="38" y="290">适合：存量、老应用、少楼栋</text>

<!-- 位置二：接入层 -->
<rect x="335" y="62" width="290" height="252" rx="6" fill="#f4fbfa" stroke="#b6dcd6"/>
<text class="lb" x="349" y="82" fill="#0f7f73">② 分界点在接入层（路由接入）</text>
<rect x="363" y="92" width="90" height="26" rx="3" fill="#fff" stroke="#8fc4bd"/>
<text class="k" x="408" y="110" text-anchor="middle">L2 域</text>
<rect x="461" y="92" width="150" height="26" rx="3" fill="#fff" stroke="#8aa9e8"/>
<text class="b" x="536" y="110" text-anchor="middle">分布：纯 L3，无 SVI</text>
<rect x="349" y="142" width="124" height="30" rx="3" fill="#fff" stroke="#2f6fed"/>
<text class="b" x="411" y="155" text-anchor="middle">接入-1（L3 网关）</text>
<text class="t" x="411" y="167" text-anchor="middle">10.20.1.1/24</text>
<rect x="481" y="142" width="124" height="30" rx="3" fill="#fff" stroke="#2f6fed"/>
<text class="b" x="543" y="155" text-anchor="middle">接入-2（L3 网关）</text>
<text class="t" x="543" y="167" text-anchor="middle">10.20.2.1/24</text>
<line x1="411" y1="118" x2="411" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="543" y1="118" x2="543" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="411" y1="172" x2="411" y2="190" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="543" y1="172" x2="543" y2="190" stroke="#7f8fb0" stroke-width="1.3"/>
<rect x="374" y="190" width="74" height="24" rx="3" fill="#fbfcfe" stroke="#8fc4bd"/>
<text class="t" x="411" y="206" text-anchor="middle">终端</text>
<rect x="506" y="190" width="74" height="24" rx="3" fill="#fbfcfe" stroke="#8fc4bd"/>
<text class="t" x="543" y="206" text-anchor="middle">终端</text>
<text class="c" x="349" y="236">每台接入一个广播域 → 无 STP/FHRP</text>
<text class="c" x="349" y="252">故障域 = 48 个端口</text>
<text class="b" x="349" y="268">子网多，需要 IPAM 与模板</text>
<text class="m" x="349" y="290">适合：新园区、终端标准化</text>

<!-- 位置三：核心层 -->
<rect x="646" y="62" width="290" height="252" rx="6" fill="#fff8ee" stroke="#f2ddb8"/>
<text class="lb" x="660" y="82" fill="#b45309">③ 分界点在核心层（大二层）</text>
<rect x="674" y="92" width="90" height="26" rx="3" fill="#fff" stroke="#e3c795"/>
<text class="k" x="719" y="110" text-anchor="middle">L2 域</text>
<rect x="772" y="92" width="150" height="26" rx="3" fill="#fff" stroke="#8aa9e8"/>
<text class="b" x="847" y="110" text-anchor="middle">核心：SVI + HSRP</text>
<rect x="660" y="142" width="124" height="26" rx="3" fill="#fff" stroke="#e3c795"/>
<text class="b" x="722" y="160" text-anchor="middle">楼 A 分布（L2）</text>
<rect x="798" y="142" width="124" height="26" rx="3" fill="#fff" stroke="#e3c795"/>
<text class="b" x="860" y="160" text-anchor="middle">楼 B 分布（L2）</text>
<rect x="660" y="182" width="124" height="24" rx="3" fill="#fbfcfe" stroke="#d9c49b"/>
<text class="t" x="722" y="198" text-anchor="middle">接入（L2）</text>
<rect x="798" y="182" width="124" height="24" rx="3" fill="#fbfcfe" stroke="#d9c49b"/>
<text class="t" x="860" y="198" text-anchor="middle">接入（L2）</text>
<line x1="719" y1="118" x2="722" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="847" y1="118" x2="860" y2="142" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="722" y1="168" x2="722" y2="182" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="860" y1="168" x2="860" y2="182" stroke="#7f8fb0" stroke-width="1.3"/>
<text class="r" x="660" y="228">STP 域直径 5–7 跳，跨楼跨配线间</text>
<text class="r" x="660" y="244">一次环路/风暴 = 多栋楼同时受影响</text>
<text class="b" x="660" y="260">收益：VLAN 跨楼、漫游与迁移简单</text>
<text class="m" x="660" y="284">适合：极少数硬需求（先证伪）</text>

<!-- 底部判据 -->
<rect x="24" y="326" width="912" height="36" rx="5" fill="#eef3ff" stroke="#c3d5f5"/>
<text class="k" x="40" y="349">三个判断依据：谁真的需要跨设备二层 · 谁承担网关 · 愿意用多少子网换多小的故障域</text>
<text class="r" x="24" y="382">最常见的错误：默认把分界点放在核心层（因为"核心看起来像边界"），结果 VLAN 跨越全部楼栋，STP 域覆盖全网。</text>
<text class="b" x="24" y="404">第二个错误：分界点在分布层，却把接入交换机改成三层 —— 网关没下移，STP 与 FHRP 一个都没消失，只是多了一跳。</text>
<text class="b" x="24" y="426">判断技巧：把"网关"画在图上。网关画在哪一层，分界点就在哪一层 —— 这句话能解决 90% 的争论。</text>
</svg>
