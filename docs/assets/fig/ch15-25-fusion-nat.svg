<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" role="img" aria-labelledby="t1525 d1525">
<title id="t1525">VRF-Aware NAT 与 Fusion Router 的拓扑，以及三处最容易发生 VRF 间路由泄漏的位置</title>
<desc id="d1525">拓扑是多个 VRF（生产、办公、访客、OT）经 Fusion Router 汇聚到防火墙与外网出口。Fusion Router 承担两个职责：一是 VRF 之间的受控互访（共享服务），二是每 VRF 默认路由的集中出口。VRF-Aware NAT 让每个 VRF 拥有独立的 NAT 池与地址转换表，避免不同 VRF 复用同一批私有地址时冲突。图中标出三处最常见的泄漏点：Fusion Router 上一条过宽的静态路由或 permit any any、防火墙上下文之间的过宽策略、以及共享出口上 NAT 池重叠导致的地址串台。底部给出三条护栏：泄漏必须有显式白名单与审计日志、共享服务只允许单向发起、以及每次变更后跑一次"跨 VRF 可达性矩阵"验证。</desc>
<style>
  .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  .lb{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  .b{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
  .k{font:600 9px "Microsoft YaHei",sans-serif;fill:#1a2233}
  .r{font:9px "Microsoft YaHei",sans-serif;fill:#a32020}
  .c{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
  .m{font:9px "Microsoft YaHei",sans-serif;fill:#b45309}
  .t{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
</style>
<rect x="0" y="0" width="960" height="460" fill="#fbfcfe"/>

<text class="h" x="24" y="30">共享出口的两个组件：VRF-Aware NAT 解决地址重叠，Fusion Router 解决互访</text>
<text class="s" x="24" y="48">两者都是"必须存在但要严管"的组件 —— 它们的配置就是隔离的边界</text>

<rect x="60" y="72" width="110" height="30" rx="3" fill="#fff" stroke="#8fc4bd"/>
<text class="t" x="115" y="91" text-anchor="middle">VRF-生产</text>
<rect x="60" y="112" width="110" height="30" rx="3" fill="#fff" stroke="#8fc4bd"/>
<text class="t" x="115" y="131" text-anchor="middle">VRF-办公</text>
<rect x="60" y="152" width="110" height="30" rx="3" fill="#fff" stroke="#8fc4bd"/>
<text class="t" x="115" y="171" text-anchor="middle">VRF-访客</text>
<rect x="60" y="192" width="110" height="30" rx="3" fill="#fff" stroke="#8fc4bd"/>
<text class="t" x="115" y="211" text-anchor="middle">VRF-OT</text>

<rect x="248" y="106" width="170" height="86" rx="5" fill="#f4f8ff" stroke="#2f6fed" stroke-width="1.6"/>
<text class="k" x="333" y="128" text-anchor="middle">Fusion Router</text>
<text class="t" x="333" y="146" text-anchor="middle">VRF 间受控互访</text>
<text class="t" x="333" y="162" text-anchor="middle">每 VRF 默认路由</text>
<text class="t" x="333" y="178" text-anchor="middle">（泄漏点 ①）</text>
<line x1="170" y1="87" x2="248" y2="126" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="170" y1="127" x2="248" y2="140" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="170" y1="167" x2="248" y2="160" stroke="#7f8fb0" stroke-width="1.3"/>
<line x1="170" y1="207" x2="248" y2="176" stroke="#7f8fb0" stroke-width="1.3"/>

<rect x="474" y="106" width="180" height="86" rx="5" fill="#fff8ee" stroke="#b45309" stroke-width="1.6"/>
<text class="k" x="564" y="128" text-anchor="middle">防火墙（多上下文）</text>
<text class="t" x="564" y="146" text-anchor="middle">每 VRF 一个上下文</text>
<text class="t" x="564" y="162" text-anchor="middle">跨上下文策略</text>
<text class="t" x="564" y="178" text-anchor="middle">（泄漏点 ②）</text>
<line x1="418" y1="149" x2="474" y2="149" stroke="#7f8fb0" stroke-width="1.3"/>

<rect x="700" y="106" width="200" height="86" rx="5" fill="#f4fbfa" stroke="#8fc4bd"/>
<text class="k" x="800" y="128" text-anchor="middle">共享出口 + NAT</text>
<text class="t" x="800" y="146" text-anchor="middle">每 VRF 独立 NAT 池</text>
<text class="t" x="800" y="162" text-anchor="middle">池重叠 = 地址串台</text>
<text class="t" x="800" y="178" text-anchor="middle">（泄漏点 ③）</text>
<line x1="654" y1="149" x2="700" y2="149" stroke="#7f8fb0" stroke-width="1.3"/>
<text class="t" x="726" y="210">→ 互联网 / WAN</text>

<rect x="248" y="222" width="170" height="34" rx="4" fill="#fff" stroke="#c8d2e0"/>
<text class="t" x="333" y="243" text-anchor="middle">共享服务（DNS/AD/打印）</text>
<line x1="333" y1="192" x2="333" y2="222" stroke="#c8d2e0" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="c" x="430" y="243">单向发起：只允许业务 VRF → 共享服务</text>

<!-- 泄漏事故 -->
<rect x="24" y="272" width="440" height="150" rx="6" fill="#fff5f5" stroke="#f0c9c9"/>
<text class="lb" x="38" y="292" fill="#a32020">泄漏事故：一条 permit any any 的代价</text>
<text class="r" x="38" y="312">① Fusion Router 上加了一条</text>
<text class="r" x="50" y="328">ip route vrf 访客 0.0.0.0/0 生产网关</text>
<text class="r" x="38" y="348">② 访客网段可以直达生产服务器</text>
<text class="r" x="38" y="366">③ 三个月后审计发现：访客设备曾</text>
<text class="r" x="50" y="382">访问过 3 台生产数据库（日志为证）</text>
<text class="m" x="38" y="406">真实风险不是"能通"，而是"没人知道能通"</text>

<rect x="496" y="272" width="440" height="150" rx="6" fill="#f4fbfa" stroke="#b6dcd6"/>
<text class="lb" x="510" y="292" fill="#0f7f73">三条护栏</text>
<text class="b" x="510" y="312">① 泄漏必须白名单化：只允许具体"源-目的-端口"，</text>
<text class="b" x="522" y="328">并强制记录审计日志（谁改了、为什么）</text>
<text class="b" x="510" y="350">② 共享服务一律单向：业务 VRF 可以发起，共享服务不回发起</text>
<text class="b" x="510" y="372">③ 每次变更跑一次跨 VRF 可达性矩阵（N×N 全测）</text>
<text class="c" x="510" y="396">矩阵结果附在变更单里 —— 这是最便宜的事后审计证据</text>

<rect x="24" y="430" width="912" height="0" fill="none"/>
<rect x="24" y="428" width="912" height="0" fill="none"/>
</svg>
