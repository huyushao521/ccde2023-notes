<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" role="img" aria-labelledby="t919 d919">
<title id="t919">MPLS TE：IGP 度量选出的路径与实际带宽需求不匹配，以及 TE 能做的四件事</title>
<desc id="d919">图上是双路径拓扑：站点 A 到站点 B 有两条等价 cost 的路径，上路 10G 已经承载 95% 流量，下路 1G 空闲；IGP 按最短 path 与 ECMP 哈希把一半新流量压到 10G 链路上，导致该链路拥塞而另一条链路闲置。这解释了为什么需要流量工程：IGP 的度量只看拓扑距离，不看带宽利用率。中间列出 TE 能做的四件事：显式路径（约束路径经过或避开指定节点）、带宽预留（为 LSP 预留带宽，让后续 LSP 选路时避开）、亲和属性（链路着属性，LSP 要求或排斥）、快速重路由（FRR 预置备份路径，故障时本地切换）。下方对比三种部署形态：RSVP-TE 逐跳信令、SR Policy 源路由段列表、以及只用 IGP 度量加 ECMP 的"无 TE"方案在带宽不均衡时的失败。底部结论：TE 解决的是"度量与需求脱钩"的问题，代价是多一个控制平面与一个需要持续维护的隧道状态。</desc>
